<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Christmas Potluck 🎄</title>
    <style>
        body { font-family: sans-serif; background-color: #f8f9fa; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #c0392b; text-align: center; margin-bottom: 5px; }
        .info { text-align: center; color: #27ae60; font-weight: bold; margin-bottom: 20px; }
        input, select { width: 95%; padding: 12px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; background-color: #c0392b; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 10px; cursor: pointer; transition: 0.3s; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #2c3e50; color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
        .summary { background: #ecf0f1; padding: 15px; border-radius: 8px; margin-top: 20px; display: flex; justify-content: space-around; font-weight: bold; }
        #loading { text-align: center; color: #7f8c8d; display: none; margin-top: 10px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>Christmas Potluck 🎄</h1>
    <div class="info">Shared Live List</div>

    <div id="form-section">
        <input type="text" id="userName" placeholder="Your Name">
        <input type="text" id="foodItem" placeholder="What are you bringing?">
        <input type="text" id="eta" placeholder="ETA (e.g. 3:00 PM)">
        <select id="category">
            <option value="Side">Side Dish / Snack</option>
            <option value="Soda">Soda 🥤</option>
            <option value="Chips">Chips 🥔</option>
            <option value="Main Dish">Main Dish</option>
            <option value="Dessert">Dessert</option>
        </select>
        <button id="addBtn" onclick="addItem()">Add to Group List</button>
    </div>
    
    <div id="loading">Updating list...</div>

    <table id="mealTable">
        <thead>
            <tr><th>Guest</th><th>Dish</th><th>ETA</th><th>Cat</th></tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <div class="summary">
        <div>🥤 Sodas: <span id="sodaCount">0</span></div>
        <div>🥔 Chips: <span id="chipsCount">0</span></div>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwCv0GICH-pyT6rpOkOT3dkRMF-USZZG4qt2ZEx62J_a2ridMZpfvS38B_wygQGmKbYLg/exec';

    window.onload = loadData;

    async function loadData() {
        document.getElementById('loading').style.display = 'block';
        try {
            const response = await fetch(scriptURL);
            const data = await response.json();
            render(data);
        } catch (error) {
            console.error('Error loading data!', error);
        }
        document.getElementById('loading').style.display = 'none';
    }

    async function addItem() {
        const name = document.getElementById('userName').value;
        const dish = document.getElementById('foodItem').value;
        const category = document.getElementById('category').value;
        const eta = document.getElementById('eta').value || "3:00 PM";

        if (!name || !dish) return alert("Please enter name and dish!");

        document.getElementById('addBtn').disabled = true;
        document.getElementById('loading').style.display = 'block';

        try {
            await fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors', // Important for Google Apps Script POST
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, dish, category, eta })
            });
            
            // Clear inputs
            document.getElementById('userName').value = '';
            document.getElementById('foodItem').value = '';
            document.getElementById('eta').value = '';
            
            // Wait a second for Google to process then reload
            setTimeout(loadData, 1500);
        } catch (error) {
            alert('Error connecting to sheet!');
        }

        document.getElementById('addBtn').disabled = false;
    }

    function render(items) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        let s = 0, c = 0;

        items.forEach((item) => {
            if (item[0] || item[1]) { // Only show rows that aren't empty
                const row = tbody.insertRow();
                row.innerHTML = `<td>${item[0]}</td><td>${item[1]}</td><td>${item[3]}</td><td>${item[2]}</td>`;
                if (item[2] === "Soda") s++;
                if (item[2] === "Chips") c++;
            }
        });

        document.getElementById('sodaCount').innerText = s;
        document.getElementById('chipsCount').innerText = c;
    }
</script>

</body>
</html>
