<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Meal Tracker 🥳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Quicksand:wght@400;600&family=Bangers&family=Lobster&family=Creepster&display=swap');
        
        body {
            font-family: 'Quicksand', sans-serif;
            transition: background-color 0.5s ease;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .loading-spinner {
            border: 3px solid rgba(0,0,0,0.1);
            border-top: 3px solid currentColor;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Theme Variations */
        body.theme-christmas { background-color: #fdfcf0; --theme-color: #c0392b; --header-font: 'Mountains of Christmas'; }
        body.theme-thanksgiving { background-color: #fef5e7; --theme-color: #d35400; --header-font: 'Lobster'; }
        body.theme-birthday { background-color: #f0f7ff; --theme-color: #3498db; --header-font: 'Bangers'; }
        body.theme-easter { background-color: #fdf2ff; --theme-color: #9b59b6; --header-font: 'Quicksand'; }
        body.theme-july4th { background-color: #f4f4f4; --theme-color: #2980b9; --header-font: 'Bangers'; }
        body.theme-newyears { background-color: #1a1a1a; --theme-color: #f1c40f; --header-font: 'Lobster'; }
        body.theme-halloween { background-color: #1a1a1a; --theme-color: #e67e22; --header-font: 'Creepster'; }
        body.theme-generic { background-color: #f4f7f6; --theme-color: #2c3e50; --header-font: 'Quicksand'; }

        .dynamic-header { font-family: var(--header-font), cursive; color: white; }
        .theme-border { border-top-width: 8px; border-color: var(--theme-color); }
        .theme-bg { background-color: var(--theme-color); }
        .theme-text { color: var(--theme-color); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 theme-christmas">

    <div class="max-w-4xl mx-auto glass-card rounded-3xl shadow-2xl overflow-hidden theme-border transition-all">
        <!-- Theme & Global Controls -->
        <div class="p-3 bg-white flex justify-between items-center text-xs border-b border-gray-100">
            <div class="flex items-center gap-2">
                <span class="font-bold uppercase opacity-50 text-[10px]">Event Style:</span>
                <select id="theme-selector" onchange="updateEventSettings()" class="bg-gray-100 p-1.5 rounded-lg font-bold outline-none border-none cursor-pointer hover:bg-gray-200 transition">
                    <option value="christmas">Christmas 🎄</option>
                    <option value="thanksgiving">Thanksgiving 🦃</option>
                    <option value="halloween">Halloween 🎃</option>
                    <option value="birthday">Birthday 🎂</option>
                    <option value="easter">Easter 🐰</option>
                    <option value="july4th">4th of July 🎆</option>
                    <option value="newyears">New Year's 🥂</option>
                    <option value="generic">Special Occasion ✨</option>
                </select>
            </div>
            <div id="auth-status" class="font-semibold text-gray-400">Syncing...</div>
        </div>

        <!-- Header -->
        <div class="theme-bg p-8 text-center relative transition-colors">
            <h1 id="display-title" class="dynamic-header text-4xl md:text-6xl mb-4 tracking-wide">Meal Tracker</h1>
            <div class="flex flex-col md:flex-row items-center justify-center gap-4 text-white/90 font-semibold">
                <div class="flex items-center gap-2 bg-white/10 px-4 py-2 rounded-full backdrop-blur-sm">
                    <span>📅</span>
                    <input type="text" id="event-date" class="bg-transparent border-b border-white/30 focus:border-white outline-none text-center w-32" value="Dec 25th" onchange="updateEventSettings()">
                </div>
                <div class="flex items-center gap-2 bg-white/10 px-4 py-2 rounded-full backdrop-blur-sm">
                    <span>🕒</span>
                    <input type="text" id="event-time" class="bg-transparent border-b border-white/30 focus:border-white outline-none text-center w-24" value="3:00 PM" onchange="updateEventSettings()">
                </div>
            </div>
        </div>

        <!-- Add Contribution Section -->
        <div class="p-6 bg-gray-50/50 border-b border-gray-100">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                <input type="text" id="new-name" placeholder="Guest Name" class="p-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-opacity-50 outline-none">
                <input type="text" id="new-item" placeholder="What are you bringing?" class="p-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-opacity-50 outline-none">
                <input type="text" id="new-eta" placeholder="Arrival Time" class="p-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-opacity-50 outline-none">
                <select id="new-category" class="p-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-opacity-50 outline-none bg-white">
                    <option value="Other">Select Category...</option>
                    <option value="Main Dish">Main Dish</option>
                    <option value="Side">Side / Snack</option>
                    <option value="Soda">Soda 🥤</option>
                    <option value="Chips">Chips 🥔</option>
                    <option value="Dessert">Dessert</option>
                    <option value="Alcohol">Alcohol 🍷</option>
                </select>
                <button onclick="addNewItem()" id="add-btn" class="md:col-span-4 theme-bg text-white font-bold py-4 rounded-2xl transition-all flex items-center justify-center gap-2 shadow-lg active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                    <span>✨</span> Add to the List
                </button>
            </div>
        </div>

        <!-- Meal Table -->
        <div class="overflow-x-auto p-2 md:p-6">
            <table class="w-full text-left">
                <thead>
                    <tr class="text-gray-400 text-xs uppercase tracking-widest font-bold">
                        <th class="p-4">Guest</th>
                        <th class="p-4">Dish / Contribution</th>
                        <th class="p-4">Arrival</th>
                        <th class="p-4">Category</th>
                        <th class="p-4 text-right">Action</th>
                    </tr>
                </thead>
                <tbody id="meal-list" class="divide-y divide-gray-100">
                    <!-- Dynamic Content -->
                </tbody>
            </table>
            <div id="empty-state" class="hidden text-center py-12 text-gray-400 italic">
                No items yet. Be the first to add something!
            </div>
        </div>

        <!-- Dynamic Summary Bar -->
        <div id="summary-bar" class="bg-gray-100/80 p-6 flex flex-wrap justify-center items-center gap-3 border-t border-gray-200">
            <!-- Badges appear here -->
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl">
            <h3 class="text-2xl font-bold mb-6 theme-text">Update Information</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Guest Name</label>
                    <input type="text" id="edit-name" class="w-full p-3 border rounded-xl mt-1" placeholder="Name">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Dish</label>
                    <input type="text" id="edit-item" class="w-full p-3 border rounded-xl mt-1" placeholder="Item">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Arrival Time</label>
                    <input type="text" id="edit-eta" class="w-full p-3 border rounded-xl mt-1" placeholder="ETA">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Category</label>
                    <select id="edit-category" class="w-full p-3 border rounded-xl mt-1 bg-white">
                        <option value="Main Dish">Main Dish</option>
                        <option value="Side">Side / Snack</option>
                        <option value="Soda">Soda 🥤</option>
                        <option value="Chips">Chips 🥔</option>
                        <option value="Dessert">Dessert</option>
                        <option value="Alcohol">Alcohol 🍷</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="flex gap-3 mt-6">
                    <button onclick="closeEditModal()" class="flex-1 py-3 text-gray-400 font-bold hover:bg-gray-100 rounded-xl transition">Cancel</button>
                    <button onclick="saveEdit()" class="flex-1 py-3 theme-bg text-white font-bold rounded-xl shadow-lg transition">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // State & Configuration
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'holiday-potluck-app';
        let db, auth, currentUser, editingId;

        const themeData = {
            christmas: { title: "Christmas Dinner Tracker 🎄", color: "#c0392b" },
            thanksgiving: { title: "Thanksgiving Feast Tracker 🦃", color: "#d35400" },
            birthday: { title: "Birthday Party Tracker 🎂", color: "#3498db" },
            easter: { title: "Easter Meal Tracker 🐰", color: "#9b59b6" },
            july4th: { title: "4th of July BBQ Tracker 🎆", color: "#2980b9" },
            newyears: { title: "New Year's Eve Tracker 🥂", color: "#f1c40f" },
            halloween: { title: "Spooky Halloween Tracker 🎃", color: "#e67e22" },
            generic: { title: "Family Gathering Tracker ✨", color: "#2c3e50" }
        };

        // Initialize Firebase
        const startApp = async () => {
            const statusEl = document.getElementById('auth-status');
            try {
                if (typeof __firebase_config === 'undefined') {
                    statusEl.innerText = "Config Missing ❌";
                    return;
                }

                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // Listen for Auth changes
                onAuthStateChanged(auth, (user) => {
                    currentUser = user;
                    if (user) {
                        statusEl.innerText = "Synced ✨";
                        statusEl.classList.add('text-green-500');
                        loadData();
                    } else {
                        statusEl.innerText = "Connecting...";
                    }
                });

                // Rule 3: Auth Before Queries
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.error("Initialization Failed:", e);
                statusEl.innerText = "Connection Error ⚠️";
                statusEl.classList.add('text-red-500');
            }
        };

        function loadData() {
            if (!db || !currentUser) return;

            const itemsCol = collection(db, 'artifacts', appId, 'public', 'data', 'mealItems');
            const settingsDoc = doc(db, 'artifacts', appId, 'public', 'data', 'eventSettings', 'main');

            // Header/Theme Sync
            onSnapshot(settingsDoc, (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    document.getElementById('event-date').value = data.date || "Dec 25th";
                    document.getElementById('event-time').value = data.time || "3:00 PM";
                    const theme = data.theme || 'christmas';
                    document.getElementById('theme-selector').value = theme;
                    applyTheme(theme);
                } else {
                    setDoc(settingsDoc, { date: "Dec 25th", time: "3:00 PM", theme: 'christmas' }).catch(console.error);
                }
            }, (err) => console.error("Settings error:", err));

            // Potluck Items Sync
            onSnapshot(itemsCol, (snap) => {
                const list = document.getElementById('meal-list');
                const empty = document.getElementById('empty-state');
                const summary = document.getElementById('summary-bar');
                list.innerHTML = '';
                
                const items = [];
                const counts = {};

                snap.forEach(docSnap => {
                    const item = { id: docSnap.id, ...docSnap.data() };
                    items.push(item);
                    counts[item.category] = (counts[item.category] || 0) + 1;
                });

                if (items.length === 0) {
                    empty.classList.remove('hidden');
                } else {
                    empty.classList.add('hidden');
                    // Simple memory sort to avoid complex index requirements
                    items.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                    items.forEach(item => {
                        const row = document.createElement('tr');
                        row.className = "hover:bg-gray-50/50 transition-colors";
                        row.innerHTML = `
                            <td class="p-4 font-bold text-gray-800">${item.name}</td>
                            <td class="p-4 text-gray-600">${item.item}</td>
                            <td class="p-4 text-blue-600 font-bold">${item.eta}</td>
                            <td class="p-4">
                                <span class="text-[10px] uppercase font-bold px-3 py-1 rounded-full bg-gray-200 text-gray-700">
                                    ${item.category}
                                </span>
                            </td>
                            <td class="p-4 text-right">
                                <div class="flex justify-end gap-1">
                                    <button onclick="openEditModal('${item.id}', '${item.name}', '${item.item}', '${item.eta}', '${item.category}')" class="p-2 opacity-30 hover:opacity-100 transition">✏️</button>
                                    <button onclick="removeItem('${item.id}')" class="p-2 opacity-30 hover:opacity-100 transition">🗑️</button>
                                </div>
                            </td>
                        `;
                        list.appendChild(row);
                    });
                }

                summary.innerHTML = Object.entries(counts).map(([cat, count]) => `
                    <div class="flex items-center gap-2 bg-white px-4 py-2 rounded-xl shadow-sm border border-gray-200 text-sm font-bold">
                        <span class="opacity-50">${cat}:</span>
                        <span class="theme-text text-lg">${count}</span>
                    </div>
                `).join('');
            }, (err) => console.error("Items error:", err));
        }

        function applyTheme(theme) {
            const config = themeData[theme] || themeData.generic;
            document.body.className = `min-h-screen p-4 md:p-8 theme-${theme}`;
            document.getElementById('display-title').innerText = config.title;
            const styleId = 'dynamic-focus-style';
            let style = document.getElementById(styleId);
            if (!style) {
                style = document.createElement('style');
                style.id = styleId;
                document.head.appendChild(style);
            }
            style.innerHTML = `
                input:focus, select:focus { border-color: ${config.color} !important; box-shadow: 0 0 0 2px ${config.color}33 !important; }
                .loading-spinner { border-top-color: ${config.color} !important; }
            `;
        }

        // --- GLOBAL ACTIONS ---

        window.addNewItem = async () => {
            const name = document.getElementById('new-name').value;
            const item = document.getElementById('new-item').value;
            const eta = document.getElementById('new-eta').value || "TBD";
            const category = document.getElementById('new-category').value;
            
            if (!name || !item) {
                alert("Please enter a name and item!");
                return;
            }

            if (!db || !currentUser) {
                alert("App is still connecting. Please wait a moment.");
                return;
            }

            const btn = document.getElementById('add-btn');
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<div class="flex items-center gap-2"><div class="loading-spinner"></div> Saving...</div>';

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'mealItems'), {
                    name, item, eta, category, timestamp: Date.now()
                });
                // Clear fields
                document.getElementById('new-name').value = '';
                document.getElementById('new-item').value = '';
                document.getElementById('new-eta').value = '';
                document.getElementById('new-category').value = 'Other';
            } catch (err) {
                console.error("Save failed:", err);
                alert("Save failed. Please check your connection.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }
        };

        window.updateEventSettings = async () => {
            if (!db || !currentUser) return;
            const date = document.getElementById('event-date').value;
            const time = document.getElementById('event-time').value;
            const theme = document.getElementById('theme-selector').value;
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'eventSettings', 'main'), { date, time, theme });
            } catch (err) { console.error("Settings update failed:", err); }
        };

        window.removeItem = async (id) => {
            if (!db || !currentUser) return;
            if (confirm("Remove this entry?")) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mealItems', id));
                } catch (err) { console.error("Remove failed:", err); }
            }
        };

        window.openEditModal = (id, name, item, eta, category) => {
            editingId = id;
            document.getElementById('edit-name').value = name;
            document.getElementById('edit-item').value = item;
            document.getElementById('edit-eta').value = eta;
            document.getElementById('edit-category').value = category || 'Other';
            const m = document.getElementById('edit-modal');
            m.classList.remove('hidden'); m.classList.add('flex');
        };

        window.closeEditModal = () => {
            const m = document.getElementById('edit-modal');
            m.classList.add('hidden'); m.classList.remove('flex');
            editingId = null;
        };

        window.saveEdit = async () => {
            if (!db || !currentUser || !editingId) return;
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mealItems', editingId), {
                    name: document.getElementById('edit-name').value,
                    item: document.getElementById('edit-item').value,
                    eta: document.getElementById('edit-eta').value,
                    category: document.getElementById('edit-category').value
                });
                closeEditModal();
            } catch (err) { console.error("Edit failed:", err); }
        };

        // Run on load
        window.addEventListener('DOMContentLoaded', startApp);
    </script>
</body>
</html>
